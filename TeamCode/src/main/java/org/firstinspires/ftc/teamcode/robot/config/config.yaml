# yaml-language-server: $schema=generated/config-schema.json
#
# BIOBUZZ (2026-2027) robot configuration. Field geometry is from Competition Manual TU05
# (Section 9) and the official field CAD; every pose and zone is written in the RED alliance's
# Pedro frame and BLUE is derived by the field's 180-degree rotational symmetry ("m" values).
#
# Pedro frame used throughout: origin at the field corner where the audience wall meets the RED
# alliance wall, +x toward the BLUE alliance wall, +y away from the audience, heading 0 = +x,
# counter-clockwise positive. The RED alliance side is x < field.size_in / 2.
meta:
  # ConfigLoader ignores an ADB-pushed override whose season differs (or is missing), so a
  # DECODE config.yaml left on the Control Hub can never silently replace BIOBUZZ values.
  season: "biobuzz"

field:
  # Inside-wall field width. The manual says "approximately 144 in"; the official CAD's inner
  # perimeter is ~141.3 in and the team's measured DECODE mirror axis was 70.75 (141.5 field).
  size_in: 141.5
  hive:
    center_to_center_in: 25.5
    pivot_height_in: 43.95
    up_opening_offset_in: 15.69
    up_opening_height_in: 59.56
    down_opening_offset_in: 21.36
    down_opening_height_in: 38.17
    frame_width_in: 49.46
    frame_depth_in: 38.95
    bottom_height_in: 30.6
    # Conservative opening for a robot in driving configuration. At 19 in above the tiles,
    # the official STEP's inward-leaning legs give 36.35 in between their innermost points.
    route_opening_width_in: 34.0
    route_opening_height_in: 18.0
  # Zone tape from the official field CAD: the RED LOADING ZONE runs from 23.91 in past the
  # field centre for 22.69 in along the RED wall, 11 in deep; the GARDEN is 22.69 x 2 in.
  loading_zone:
    start_y_in: 94.66
    width_in: 22.69
    depth_in: 11.0
  garden:
    length_in: 22.69
    depth_in: 2.0
  # FLOWER top-ring centre from the official field CAD.
  flower:
    wall_offset_in: 2.65
    corner_offset_in: 47.36

hive:
  # A CELL whose opening centre is above this height is upward-facing. Upward openings sit at
  # ~59.6 in and downward ones at ~38.2 in, so the midpoint leaves ~10 in of margin either way.
  up_height_threshold_in: 48.9
  confirm_frames_count: 3
  settle_ms: 1500
  max_observation_age_ms: 400

match:
  auto_ms: 30000
  teleop_ms: 120000
  flower_unlock_remaining_ms: 60000
  # TELEOP time remaining at which the park alert starts watching the drive time to park.
  final_warning_remaining_ms: 20000

inventory:
  # G407: a ROBOT may not CONTROL more than 4 SCORING ELEMENTS at a time.
  capacity_count: 4
  preload_count: 4
  entry_sensor_enabled: false
  entry_sensor_name: "intakeBeam"
  entry_sensor_active_low: true
  entry_debounce_ms: 40

pedro:
  tuning:
    short_stage_timeout_s: 6.0
    braking_stage_timeout_s: 70.0
    validation_turn_degrees: 90.0
  drivetrain:
    front_left_motor: "leftFront"
    front_right_motor: "rightFront"
    back_left_motor: "leftBack"
    back_right_motor: "rightBack"
    front_left_direction: "REVERSE"
    front_right_direction: "FORWARD"
    back_left_direction: "REVERSE"
    back_right_direction: "FORWARD"

  localization:
    pinpoint_name: "pinpoint"
    pod_type: "goBILDA_4_BAR_POD"
    x_pod_offset: 5.992710984597995
    y_pod_offset: 2.0555174820066435
    x_pod_direction: "REVERSED"
    y_pod_direction: "FORWARD"

  heading:
    pid:
      p: 5.77104718
      i: 0.0
      d: 0.0
    ks: 0.0

  translation:
    gain_threshold: 2.5
    forward:
      small_error_pid:
        # Refined with repeated 10/12-inch endpoint trials on 2026-11-11.
        p: 0.28
        i: 0.0
        d: 0.0
      large_error_pid:
        p: 0.336690633
        i: 0.0
        d: 0.0
    strafe:
      small_error_pid:
        # Refined on turn, curve and straight-line endpoint checks on 2026-11-11.
        p: 0.35
        i: 0.0
        d: 0.0
      large_error_pid:
        p: 0.598928941
        i: 0.0
        d: 0.0

  feedforward:
    coast_kv: 0.0143895151
    brake_kv: 0.0122310878

  braking:
    forward:
      # Closed-loop curve validation: earlier braking than the initial plant fit.
      linear: 0.18
      quadratic: 0.000985767102
    strafe:
      linear: 0.0616962691
      quadratic: 0.00180027583
    heading:
      # Validated with repeated +/-90-degree turn-and-return tests.
      linear: 0.075
      quadratic: 0.000336377129

  motion:
    max_forward_velocity: 72.7643946
    max_strafe_velocity: 59.8370649
    natural_forward_deceleration: 33.6622494
    natural_strafe_deceleration: 71.7687232
    # Speed fraction reduced from 0.90 after 10-inch trials showed less endpoint overshoot.
    max_path_speed: 0.75

# Shared Axon hardware settings for the main turret and isolated checkout.
turret_servo_test:
  # Expansion Hub SERVO port 4; Control Hub SERVO port 1. Ports live in the RC configuration.
  left_servo_name: "turnservo1"
  right_servo_name: "turnservo2"
  left_analog_name: "turnAnalogLeft"
  right_analog_name: "turnAnalogRight"
  pwm_lower_us: 500.0
  pwm_upper_us: 2500.0
  # Holding references checked individually after shaft reassembly on 2026-11-13.
  # Recheck after reindexing either gear; these are not calibrated turret travel limits.
  # Both gears must remain engaged to support this turret during mounted tests.
  left_center_position: 0.26
  right_center_position: 0.406
  left_reversed: false
  right_reversed: false
  # Nominal +/-24.576 turret degrees, 3.84 degrees per tap, at 360 shaft degrees and 64:150 gearing.
  # Still a command window: physical angle, mechanical clearance and gear engagement need checking.
  max_jog_offset: 0.16
  jog_step_position: 0.025
  max_enable_sec: 3.0
  # Set true only after the two centers/directions are mechanically aligned and verified.
  pair_verified: false

turret:
  # Off: the turret is treated as facing straight ahead (angle 0) and every shot is aimed by
  # turning the chassis. Neither Axon is mapped, so nothing holds the turret: keep it locked forward.
  enabled: false
  # Optional diagnostic sensor, currently unplugged. Main drivetrain "pinpoint" stays enabled.
  turn_pinpoint_enabled: false
  dual_position:
    enabled: true
    # Nominal scale from the owner's 64-tooth pinions and 150-tooth turret gear.
    # Confirm programmed servo sweep, assembled forward zero and CCW sign before enabling aiming.
    angle_calibrated: false
    servo_gear_teeth: 64
    turret_gear_teeth: 150
    servo_sweep_deg: 360.0
    positive_offset_ccw: true
    left_reference_volts: 0.881
    right_reference_volts: 1.360
    left_volts_per_position: 3.10
    right_volts_per_position: 3.15
    manual_position_per_sec: 0.02
    feedback_startup_sec: 0.5
    max_update_gap_sec: 0.1
  max_power_output: 0.5
  servo_direction_inverted: false
  ks_positive: 0.0009
  ks_negative: 0.0663
  orientation:
    logo: "LEFT"
    usb: "UP"
  travel:
    min_angle: -26.5
    max_angle: 26.5
  stall:
    enabled: true
    power_threshold: 0.12
    min_progress_deg: 0.75
    timeout_sec: 0.35
    # A stall fault cuts power, then clears itself after this long (0 = latch until restart).
    retry_after_sec: 1.0
  runaway:
    enabled: false
    divergence_deg: 8.0
  pidf:
    p: 0.02
    i: 0.008
    d: 0.0
    f: 0.0
  # Feedforward (power per deg/s) for the turret rate the chassis motion demands: 1 / K from the
  # Turret Plant Calibration OpMode (K = deg/s per unit power). Without it the turret lags ~10 deg
  # behind a chassis turning at 30 deg/s. 0 disables; measure K before enabling.
  kv: 0.0
  # Chassis-driven turret rates below this (deg/s) are odometry noise: no feedforward.
  ff_min_rate_dps: 3.0
  # Turret axis position relative to the robot centre. Bearings and shot distances are measured
  # from here; at BIOBUZZ ranges a 4 in offset is a 6-9 deg aim error.
  pivot_forward_in: 0.0
  pivot_left_in: 0.0
  # Clamped I term (pidf.i is its gain). It is reset on settling, at a travel stop and whenever
  # the loop restarts, so idle time and long slews can no longer wind it up.
  integral:
    band_deg: 30.0
    limit_power: 0.08
  tolerance:
    # Total lateral miss (in) allowed at the CELL opening. The opening is 20 in wide (~15 in seen
    # 40 deg off-axis) and a NECTAR is 3.6 in, so 8 in leaves margin either side.
    max_drift: 8
    near_cutoff: 1
    near_val: 1.5
    min_deg: 0.5
    max_deg: 4
    # Once settled, the turret is left alone until the error exceeds tolerance * exit_factor.
    exit_factor: 1.5
  analog_encoder:
    enabled: true
    zero_voltage: 1.2650
    degrees_per_volt: 42.15
    min_voltage: 0.556
    max_voltage: 1.964
    full_scale_voltage: 3.3
    inverted: true

vision:
  # Off: no camera. The HIVE tracker then learns which CELL is up only from the drivers (driver
  # LT/RT pick the goal, operator LB/BACK record and undo a TIP), and relocalizing does nothing.
  enabled: false
  # Stream continuously so the HIVE tracker sees every TIP; false streams only while relocalizing.
  continuous: true
  camera_name: "Webcam 1"
  decimation: 3
  # Camera extrinsics in the robot frame. BIOBUZZ AprilTags are on the bottoms of CELLS 30-60 in
  # above the TILES, so the camera must be pitched up; measure and replace these on the robot.
  camera:
    forward_in: 3.54
    left_in: 4.72
    height_in: 7.68
    yaw_deg: 0.0
    # Fitted 2026-11-07 (Hive Vision Test): BLUE SCORING, known upward (59.6 in), read 50.8 in at
    # 50 deg; 58.2 deg puts it at 59.6 in with height_in held at 7.68. Only one CELL was in view,
    # so pitch and height_in are not separated: refit both when an up and a down CELL are seen together.
    pitch_up_deg: 58.2
  relocalize:
    max_range_in: 72.0
    max_correction_in: 18.0

# Chassis outline, measured 2026-11-15: 18 in front to back, 17.5 in side to side, goBILDA
# GripForce 104 mm mecanum wheels on a 13 in track (centred side to side). Pedro's pose is the spin
# centre: the Pinpoint offsets were tuned by spinning in place, which turns a mecanum robot about
# the middle of its wheel centres, halfway between the axles. Here that is 6.75 in from the back
# edge and 11.25 in from the front. The start and reset poses are placed from these numbers;
# StartPoseGeometryTest checks them against this outline (not Sentinel's square footprint).
chassis:
  robot_length_in: 18.0
  robot_width_in: 17.5
  # R102 starting envelope with mechanisms in driving position. Update if they extend upward.
  drive_height_in: 18.0
  back_axle_from_back_in: 2.5
  front_axle_from_back_in: 11.0
  # Left wheel centre to right wheel centre. With the axles it places the four wheel contacts that
  # PARK is judged by (Sentinel.isParked).
  wheel_track_in: 13.0

sentinel:
  robot_width: 18
  # Off: nothing is refused because of the footprint. The driver's turn is never zeroed near the
  # HIVE, a shot turns in place to face its CELL without the sweep check, TeleOp pose holds drive
  # straight to their target, and AutoRouteSafetyTest's footprint checks are skipped. The square
  # footprint above is centred on the pose, but the pose is 6.75 in from the back edge (chassis),
  # so the square is 2.25 in off at the front and back. The park route still plans around the HIVE.
  footprint_safety_enabled: false
  rotation_lookahead_time: 0.0685
  # true: the whole HIVE frame base is a no-drive zone (the robot never passes under the HIVE).
  # false: only the two 2 in foot bars are protected, for a robot built to drive under the HIVE.
  # Such a robot must stay below field.hive.bottom_height_in and clear the A-frame legs, which
  # lean inward from the feet toward the pivots (official CAD) and are not modelled here.
  protect_full_hive_footprint: true
  frame_base_width_in: 2.0
  allow_under_hive_routes: true
  route_wall_clearance_in: 1.0
  # A robot pushed against a wall reads slightly past it (the Pinpoint returns the reset corner
  # 5e-7 in out; heading noise swings the corners further). A route starting up to this far past a
  # wall is planned from the wall; farther out the pose is not trusted and nothing is planned.
  route_start_tolerance_in: 1.0
  center_line_margin_in: 0.25
  wall_contact_tolerance_in: 0.5
  park_lane_margin_in: 3.0
  # Every park pose puts exactly one wheel in the LOADING ZONE: that wheel's contact at least this
  # far inside the zone tape, the other three at least this far outside, leaving the rest of the
  # zone to the partner. Half a wheel width plus end-of-path error. AutoRouteSafetyTest checks it.
  park_wheel_margin_in: 3.0
  route_sample_step: 0.005
  # Driven go-arounds (Sentinel.routeAround) round each corner into a Bezier curve that starts and
  # ends this far either side of it, so the robot does not stop there. Each curve is re-checked;
  # a corner whose curve is not clear stays sharp.
  route_corner_radius_in: 12.0
  # Conservative drive-time estimate for a park route: a trapezoidal profile from pedro.motion,
  # this turn rate and a settle per waypoint. Used by the TeleOp park alert and the AUTO tests.
  park_turn_rate_dps: 180.0
  park_settle_per_waypoint_sec: 0.25
  geometry_epsilon_in: 0.000000001

casablanca:
  enable_depth_protection: false
  enable_side_protection: false
  repulsion:
    power: 0.12
    decel_safety_factor: 0.7
  depth:
    slow_down: 8.0
    hard_stop: 2.5
  side:
    slow_down: 8.0
    hard_stop: 2.5
  lane_blend_distance: 12
  friction:
    x: 0.1041
    y: 0.1488
    rot: 0.1041
  smoothing:
    teleop_enabled: false
    auto_enabled: false
    # Seconds per unit power change; 0 bypasses only that signed direction.
    forward:
      increase_time: 0.22
      decrease_time: 0.55
    strafe:
      increase_time: 0.22
      decrease_time: 0.22
    turn:
      increase_time: 0.088
      decrease_time: 0.088
    max_loop_dt: 0.05
  heading_lock:
    enabled: true
    # TeleOp Heading Lock Autotuner, 2026-11-14 (calibration-data/agent-runs/20261114-23*): best of
    # the P {1,4,7,10} x D {0,.3,.6,.9} grid, then 5/5 searches passed (+/-10 deg steps, overshoot
    # <= 2.1 deg, settled 0.65-1.11 s). The old p 5.818 / d 0 passed 0/4: it overshot 1.9-4.1 deg.
    pid:
      p: 4.0
      i: 0.0
      d: 0.6
    ks: 0.0
    intent_threshold: 0.05
    ks_moving: 0.0003
    moving_speed_threshold: 10.0
    max_power: 0.30
    error_deadband_deg: 2.0
    settle_rate_dps: 15.0

  heading_tuner:
    # A lane beside the HIVE, 17 in clear of its frame: HIVE protection never acts, so trials can
    # finish. (72, 72) was inside the HIVE frame and every trial aborted. TunerPoseSafetyTest.
    calibration_pose: [20.0, 72.0, 90.0]
    step_degrees: 10.0
    maximum_sweep_degrees: 30.0
    position_drift_inches: 4.0
    heading_tolerance_degrees: 2.5
    rate_tolerance_dps: 5.0
    overshoot_limit_degrees: 3.0
    settle_sec: 0.4
    trial_timeout_sec: 4.0
    stopped_speed_ips: 1.0
    sample_period_ms: 10
    # The robot loop stalls past 100 ms now and then (144 ms seen): at 0.1 every trial aborted.
    maximum_sample_gap_sec: 0.25
    p_min: 1.0
    p_max: 10.0
    p_count: 4
    d_min: 0.0
    d_max: 0.9
    d_count: 4

  jump_tuner:
    trial_axis: "FORWARD"
    rotation_trial_power: 0.2
    drive_angle_degrees: 15.0
    maximum_angle_degrees: 35.0
    angular_stop_margin_degrees: 5.0
    angular_speed_bound_dps: 180.0
    # Pinpoint pitch/roll is preferred automatically. These configure the fallback only.
    imu_name: "imu"
    imu_logo: "RIGHT"
    imu_usb: "UP"
    # Same lane: +/- 48 in along y inside the walls. STRAFE trials start here turned 90 degrees.
    calibration_pose: [20.0, 72.0, 90.0]
    trial_power: 0.5
    max_travel_inches: 48.0
    drive_distance_inches: 16.0
    stop_margin_inches: 4.0
    reaction_time_sec: 0.05
    speed_bound_ips: 75.64281986
    baseline_sec: 0.5
    peak_hold_sec: 0.1
    settle_sec: 0.4
    stopped_speed_ips: 1.0
    baseline_rate_dps: 5.0
    jump_tilt_deg: 3.0
    jump_rate_dps: 90.0
    jump_hold_sec: 0.04
    emergency_tilt_deg: 10.0
    imu_stale_sec: 0.25
    trial_timeout_sec: 8.0
    stall_timeout_sec: 1.0
    minimum_progress_inches: 0.25
    minimum_progress_degrees: 0.5
    heading_drift_deg: 12.0
    lateral_drift_inches: 4.0
    power_tolerance: 0.01
    sample_period_ms: 10
    minimum_slew_time: 0.05
    maximum_slew_time: 0.8
    search_factor: 1.25
    candidate_count: 12



shooter:
  # false: this code's loop (kS + kV feedforward at nominal_voltage, voltage compensation, P and a
  # clamped I; FlywheelClosedLoopProperties checks it across calibration error, battery and lag).
  # The firmware PIDF (motor_pidf) oscillated: its p was 150, ~68x REV's recipe for this F.
  use_ftc_pid: false
  # kS, pidf and kick.wheel_tau_sec from Shooter Characterization on 2026-11-15 on an end-of-match
  # battery (12.8 V idle, 10.1 V under a kick): 11-point fit RMS 0.005 power, matched by an
  # independent fit of the 100 Hz recording (calibration-data/agent-runs/*-shooter-char-lowv-1115).
  # The first fit with the wheel turning the shooting way since Shooter's motor directions changed
  # on 11-14; the 11-07 constants (from before) ran the feedforward ~3% hot.
  ks: 0.0757
  nominal_voltage: 12.0
  max_voltage_compensation: 1.4
  # A full-power kick sags the bus ~1.5 V. At 0.25 s a reading taken in the sag scaled the next
  # quarter second ~12% hot and pushed a 1350->1700 recovery to 1.035x; 0.05 s held every recovery
  # inside the feed band on the robot.
  voltage_refresh_sec: 0.05
  # Every *_rpm value in this section is DcMotorEx.setVelocity units (encoder ticks/second).
  # Target power 1.0 maps here. Keep it at or below what full power reaches at nominal_voltage,
  # (1 - kS) / kV: 2390 on 2026-11-15. Changing it rescales every fraction of it
  # (teleop.manual_rev_power).
  max_rpm: 2300
  constant_rpm: 1000
  min_transfer_threshold: 0.97
  max_velocity_threshold: 1.03
  feed_release_threshold: 0.80
  feed_intake_power: 1.0
  ball_detection:
    dip_fraction: 0.09
    rebound_fraction: 0.05
    baseline_alpha: 0.03
    refractory_ms: 120
  timing_tuner:
    # Manually aimed catch-area test at constant_rpm; no turret movement or shot-table lookup.
    bench_mode: true
    distances_in: [24.0, 30.0, 36.0, 42.0, 48.0]
    ray_off_axis_deg: -40.0
    # Duration is measured from spin-up through all requested dips and final recovery.
    # There is no preset trial duration or added timing margin; LT/STOP cancels.
    dip_step: 0.005
    trigger_threshold: 0.3
  # p = 2 kV (loop gain 2) and i = p / 2 s (2 s integral time), integrating only inside
  # integral.band_ticks. P alone (the old p = 0.3 kV) left any feedforward error almost
  # undiminished, so the wheel sat outside the 0.97-1.03 feed band whenever kS or kV was off.
  # Higher gain tolerates less sensor lag and hides ball dips; a faster integral overshoots after
  # each ball. Chosen by sweep over kS +/-50%, kV +/-20%, 11.5-13.8 V, 0-2 loops of lag.
  pidf:
    p: 0.000773
    i: 0.0003865
    d: 0
    f: 12.666
  # Only with use_ftc_pid: true. REV's recipe for this F: p = 0.1 F, i = 0.1 p.
  motor_pidf:
    p: 2.204
    i: 0.2204
    d: 0
    f: 22.04
  # The integrator corrects feedforward error, so its clamp must cover the worst plausible error:
  # kS 50% off plus kV 20% off at max_shot_rpm is ~0.24 power. 0.15 left the wheel just over the
  # feed band in that corner.
  integral:
    band_ticks: 150.0
    max_contribution: 0.25
  # Recovery kick (utilities/FlywheelKick): once the wheel reads kick_trigger_fraction below target
  # (a ball, or spin-up), the most power the wheel model (kS, kV, the integrator's correction,
  # wheel_tau_sec) allows without passing target next loop, until the speed predicted over
  # sensor_lag_sec reaches min_transfer_threshold. With the model configured, P also acts on that
  # predicted speed. No gain to tune: both times come from Shooter Characterization's step test.
  # wheel_tau_sec 0 disables the kick and the prediction (the loop above, unchanged).
  kick:
    wheel_tau_sec: 0.290
    # The step test fit 0.022 s, but with it the kick handed off a wheel already near target and
    # overshot to 1.04-1.06x; the 50 Hz recorder fits 0.040 s on the same step (the hub velocity is
    # a 50 ms count, 20 ticks/s steps). 0.045 s: no spin-up or recovery overshoot on the robot.
    # 2026-11-15 (OpMode 0.024 s, 100 Hz recorder 0.035 s): three spin-ups 0 -> 1340 peaked at
    # 1.045, 1.030 and 1.015 and held +-1.5% (one reading step) from 0.25-0.36 s, at 10.1-12.8 V.
    sensor_lag_sec: 0.045
    kick_lag_margin_sec: 0.0075
    kick_trigger_fraction: 0.09
    kick_speed_margin: 1.4
  ballistics:
    v0: 250.0
    k: 0.0012
    magnus_l: 0.015
    launch_height_inches: 15.0
    g_inches_per_sec2: 386.088
    min_hood_angle_deg: 15.0
    max_hood_angle_deg: 65.0
    min_hood_servo_pos: 0.85
    max_hood_servo_pos: 0.0
    # Steep lobs fly ~0.6-0.8 s, so lead grows fast with speed; start conservative.
    max_moving_speed_ips: 20.0
    # This robot shoots from close in: the AUTO volley poses are 28-34 in from their CELL (shoot_a,
    # 42.8 in, is a fixed shot at teleop.manual_rev_power and does not use the table). Ballistics
    # Calibration covers 20-40 in, the closest the robot gets without touching the HIVE frame to a
    # little past the farthest volley pose.
    min_valid_distance: 20.0
    max_valid_distance: 40.0
    max_off_axis_deg: 60.0
    lead_bias_gain: 1.0
    v0_reference_rpm: 1000.0
    preferred_shot_rpm: 800.0
    max_shot_rpm: 1450.0
    v0_margin_fraction: 0.12
    rpm_update_deadband: 25.0
    # Lob flight time ~ base + per_inch * range; seeded from a launch model (0.63 s at 24 in,
    # 0.80 s at 60 in). Only used to lead moving shots.
    flight_time_base_sec: 0.51
    flight_time_sec_per_inch: 0.0049
    lead_min_speed_ips: 10.0
  shot_table:
    # PLACEHOLDER rows seeded from a launch model for the CELL opening (59.6 in up), not
    # measured. While calibrated is false the automatic feed gate refuses to fire; run the
    # Ballistics Calibration OpMode for each SCORING ELEMENT, paste its rows, then set true.
    calibrated: false
    # This robot cannot intake or launch NECTAR (3.6 in), so only the POLLEN table is used.
    # The NECTAR rows below stay in place for a future mechanism; set true to allow selecting them.
    nectar_enabled: false
    # distance_in, hood_servo, flywheel ticks/s. There is no hood servo: the hood column is kept for
    # the format and is always 0. PLACEHOLDER rows over min/max_valid_distance.
    pollen_points: [
        20.0, 0.0000, 800.0,
        24.0, 0.0000, 810.0,
        28.0, 0.0000, 820.0,
        32.0, 0.0000, 830.0,
        36.0, 0.0000, 840.0,
        40.0, 0.0000, 855.0
      ]
    nectar_points: [
        20.0, 0.0000, 880.0,
        24.0, 0.0000, 890.0,
        28.0, 0.0000, 900.0,
        32.0, 0.0000, 910.0,
        36.0, 0.0000, 925.0,
        40.0, 0.0000, 940.0
      ]

auto:
  # false: a volley ends only when the flywheel dip detector has counted its balls (or the robot is
  # known empty); the park guard still ends the routine at its park deadline. true also ends it
  # when the shot_time_points window runs out, even if a ball was not counted.
  shot_window_enabled: false
  # distance_in, shoot_window_ms pairs written by the Shot Timing Tuner. Measured 2026-11-15 from a
  # flight recording of a 4-ball volley at 1380 ticks/s, 41.8 in from CELL A, on an end-of-match
  # battery: balls hit the wheel 0.70, 1.77, 2.34 and 2.76 s after the flywheel started and it was
  # back in band at 2.94 s. The transfer, not the distance, sets that pace, so one row (clamped)
  # covers every distance until the Shot Timing Tuner measures more.
  shot_time_points: [
      41.8, 2940
    ]
  shoot_wait_ms: 2500
  balls_per_volley_count: 4
  tip_wait_ms: 2500
  collect_dwell_ms: 1200
  # Park deadline: AUTO stops the routine and parks once the time left is no more than the estimated
  # drive to park (stopping from the current speed, then the route around the HIVE) plus
  # park_margin_ms, and never later than park_reserve_ms before the end. Re-estimated every
  # park_update_ms. The estimate is deliberately slow (strafe top speed, a settle per corner).
  park_margin_ms: 2500
  park_reserve_ms: 3000
  park_update_ms: 250
  # Down AUTO: sit at the start this long after START, then park (down_park true) or only drive off
  # the wall for LEAVE (false). The park deadline still cuts a long wait short.
  down_wait_sec: 0.0
  down_park: true
  intake_power: 1.0
  # This robot cannot take POLLEN from a FLOWER, so neither routine refills. CELL A still drives
  # the FLOWER-side lane around the HIVE (without stopping) to fire any POLLEN left after the TIP
  # into CELL B.
  cell_a_collect_flower: false
  cell_a_second_volley: true
  cell_b_collect_flower: false

intake:
  transfer_servo_name: "intakeTransfer" # Continuous Rotation Servo, Control Hub servo port 5.
  # Tracks shot feed during a shot and the shooter target during a manual rev; off while collecting.
  transfer_power: 1.0
  transfer_reversed: true

# Axon MK2 flower flap, used only by TeleOp. No command at INIT/START until the first toggle.
flap:
  enabled: true
  servo_name: "flapservo" # Expansion Hub servo port 3, assigned in Driver Station configuration.
  pwm_lower_us: 500.0
  pwm_upper_us: 2500.0
  # Nominal full shaft sweep; verify the servo is programmed in 360-degree positional mode.
  servo_range_deg: 360.0
  # Normalized servo positions: UP 0.12 (43.2 / 360), DOWN 0.9 (324 / 360).
  up_angle_deg: 43.2
  down_angle_deg: 324.0
  reversed: false

teleop:
  max_speed: 1
  # Stick-forward drives away from the drivers' own alliance wall (+x RED, -x BLUE) whatever the
  # robot's heading. Needs a trusted heading: the AUTO handoff pose or driver BACK at the reset corner.
  field_centric: true
  field_centric_offset_deg: 0
  intake_power: 1.0
  # The fixed shot from poses.*.shoot_a (operator RT and X, Up AUTO preloads): 1310 ticks/s
  # (x max_rpm 2300), the best of 1300-1380 tried from shoot_a in Shooter Spot Tuner, 2026-11-15.
  manual_rev_power: 0.5696
  eject_power: -0.6
  # Operator aim-and-shoot first drives straight toward or away from the upward CELL until the robot
  # is this far from its opening (shoot_a is 42.8 in), if it is more than the tolerance off, and
  # feeds only once it is within the tolerance of that spot. Tune with the shot's flywheel speed.
  shot_distance_in: 28.0
  shot_position_tolerance_in: 1.5
  # Driver D-pad drives around the HIVE to the FLOWER that way and holds its pickup pose: one of
  # the four quarter turns of poses.<alliance>.flower about the field centre. Off: the D-pad does
  # nothing.
  flower_hold_enabled: true
  # The D-pad FLOWER trip stops this far short of the pickup pose, lowers the flower flap, waits
  # flower_flap_settle_ms for it to come down, then drives the rest of the way in.
  flower_flap_lead_in: 2.0
  flower_flap_settle_ms: 500
  rumble_ms: 600
  # Park alert, from match.final_warning_remaining_ms on: once the time left is no more than the
  # estimated drive to the park pose plus this margin, rumble, speak and flash until parked.
  park_alert_margin_ms: 4000
  park_alert_update_ms: 250
  park_alert_repeat_ms: 1000
  # Poses are the spin centre: Pinpoint offsets were tuned spinning in place, so it is midway
  # between the axles (2.5 and 11 in from the back edge): 6.75 in from the back, 11.25 from the
  # front, 8.75 from each side (18 x 17.5 in robot). Starts put the back edge on the wall.
  poses:
    red:
      start: [58.0, 6.75, 90]
      # One wheel in (sentinel.park_wheel_margin_in): the front-left wheel 3 in past the LOADING
      # ZONE's audience-side tape (y 94.66) and 4.5 in in from its wall-side edge, the others out.
      # The left side is 4.25 in off the RED wall (LEAVE). Driver Y, the park alert and Up AUTO.
      park: [13.0, 93.41, 90]
      # Shooter Spot Tuner shot best on 2026-11-15 from (59.2, 12.5) at heading 87, at
      # manual_rev_power. Squared to 90 and moved so the aim line still crosses CELL A's opening
      # distance (42.4 in out) at the same point, x = 61.4, 3.4 in right of the opening centre.
      shoot_a: [61.4, 12.4, 90]
      # shoot_a turned 180 degrees about the HIVE pivot (58.0, 70.75): CELL B seen exactly as
      # shoot_a sees CELL A, the same distance and 3.4 in to the robot's right.
      shoot_b: [54.6, 129.1, 270]
      flower: [16.0, 47.36, 180]
      # Odometry reset (driver BACK): the audience-wall / RED-wall corner, back on the audience wall
      # (spin centre 6.75 in out), left side on the RED wall (8.75 in out), facing the rear wall.
      reset: [8.75, 6.75, 90]
    blue:
      start: m
      park: m
      shoot_a: m
      shoot_b: m
      flower: m
      # k: the same physical corner (next to the RED HIVE) in BLUE matches too.
      reset: k

# Autonomous routines. CELL A is the alliance's CELL that starts upward-facing (RED audience
# CELL, BLUE rear CELL); CELL B is the other CELL of the same HIVE. Blue poses are the 180-degree
# rotation of red about the field centre.
auto_poses:
  cell_a:
    red:
      start: [58.0, 6.75, 90]
      score_a: [58.0, 27.0, 90]
      flower: [16.0, 47.36, 180]
      score_b_cp: [16.0, 100.0, 0]
      score_b: [36.0, 106.0, 318.36]
      park: [13.0, 93.41, 90]
    blue:
      start: m
      score_a: m
      flower: m
      score_b_cp: m
      score_b: m
      park: m
  cell_b:
    red:
      start: [30.0, 134.75, 270]
      score_b_cp: [30.0, 114.0, 0]
      score_b: [58.0, 114.0, 270]
      flower: [47.36, 125.5, 90]
      alt_via: [30.0, 104.0, 0]
      alt_a: [32.0, 33.0, 40.31]
      # One wheel in at the zone's rear end: front-right wheel 3 in inside the y 117.35 tape.
      park: [13.0, 118.6, 270]
    blue:
      start: m
      score_b_cp: m
      score_b: m
      flower: m
      alt_via: m
      alt_a: m
      park: m
  # Park Only: no shot. Starts in the RED-wall / rear-wall corner, opposite the reset corner and
  # next to the LOADING ZONE: back on the rear wall, right side on the RED wall, facing the audience.
  # Drives straight to the zone's rear end with one wheel in (front-right wheel 3 in inside y 117.35).
  park_only:
    red:
      start: [8.75, 134.75, 270]
      park: [13.0, 118.6, 270]
    blue:
      start: m
      park: m
  # Up: start on CELL A's side, drive to teleop.poses.*.shoot_a, fire the preloads at
  # teleop.manual_rev_power, then park with one wheel in the LOADING ZONE's audience end.
  # Start: back on the audience wall, left side on the first tile seam from the RED wall
  # (size_in / 6 = 23.58 in), so the spin centre is 23.58 + 8.75 = 32.33 in out. Check the seam on
  # the real field: tiles are not always exactly size_in / 6.
  up:
    red:
      start: [32.333, 6.75, 90]
      park: [13.0, 93.41, 90]
    blue:
      start: m
      park: m
  # Down: starts at up.*.start flipped across the field's middle (DownAuto.flipOfUp; no separate
  # key): RED's back on the rear wall facing the audience at (32.333, 134.75, 270), right side on the
  # same TILE seam. Waits auto.down_wait_sec, then parks with one wheel in the LOADING ZONE's rear
  # end (auto.down_park) or only drives forward off the wall to leave (LEAVE, no PARK). Never shoots.
  down:
    red:
      # One wheel in at the zone's rear end: front-right wheel 3 in inside the y 117.35 tape.
      park: [13.0, 118.6, 270]
      # Straight ahead of the start, back edge 4 in off the rear wall, front 2 in short of the zone.
      leave: [32.333, 130.75, 270]
    blue:
      park: m
      leave: m

# Agent bridge: HTTP endpoints under /agent/ on the Robot Controller's web server (port 8080)
# for the laptop MCP server in tools/robot-mcp. It records hardware and OpMode telemetry, plays
# gamepad scripts into the running OpMode, inits/starts/stops OpModes and sets config values in
# memory. It never writes an actuator: OpModes still own every motor and servo.
agent_bridge:
  # Off: every endpoint except /agent/status answers 403. Turn off before competitions.
  bridge_enabled: true
  # Independent hardware sampling: one bulk read per hub per sample, sent as its own command so
  # the OpMode's bulk cache is never cleared or replaced.
  record_rate_hz: 50
  # 30000 rows is 10 minutes at 50 Hz; samples past it are dropped and the run is marked full.
  record_max_rows: 30000
  # Motor currents cost one hub command per motor, so they are read every Nth sample (0: never).
  current_every_n_samples: 10
  telemetry_buffer_entries: 2000
  # Longest gamepad script the bridge accepts, and how often a running script is advanced (its
  # timing resolution).
  max_script_ms: 120000
  script_tick_ms: 5
  # An OpMode the bridge started is stopped when no bridge request arrives for this long, so a
  # stalled agent cannot leave a mechanism running. 0 disables.
  deadman_ms: 30000
  # Flight recorder: one row per change in what the OpMode read (each new hub bulk read, each
  # Pinpoint update), taken from the SDK's caches, so it adds no hub traffic. Written to
  # /sdcard/FIRST/flight/<time>-<label>/ while it runs. Started by the agent (flight_record) or,
  # with flight_auto, for every OpMode run.
  flight_auto: false
  # How often the caches are checked for a new read; above the OpMode's loop rate.
  flight_poll_hz: 500
  # How often rows reach the file (the most a robot-app crash can lose).
  flight_flush_ms: 500
  # 200000 rows is about 17 minutes at a 200 Hz loop; later rows are dropped and the flight
  # marked truncated.
  flight_max_rows: 200000
  # Flights kept on the robot; older ones are deleted when a new one starts.
  flight_keep: 30
